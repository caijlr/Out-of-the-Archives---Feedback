<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Your Experience - Out of the Archives</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f0f0f0; 
      color: #222;
      padding: 40px 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
    }

    .container { 
      background: #ffffff; 
      padding: 40px 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 600px; 
    }

    h1 { 
      color: #111; 
      margin-bottom: 10px; 
      font-weight: 700;
      font-size: 26px;
      text-align: center;
    }

    p.intro {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
      text-align: center;
    }

    /* Prevent breaking the project name across lines */
    .brand-name {
      white-space: nowrap;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
    }

    /* Star Rating System */
    .star-rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 25px;
    }

    .star-rating input {
      display: none;
    }

    .star-rating label {
      font-size: 36px;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.1s ease;
      margin: 0;
    }

    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input:checked ~ label {
      color: #d15651;
    }

    .star-rating label:hover {
      transform: scale(1.15);
    }

    /* Input & Select Styling */
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #333;
      background-color: #fafafa;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #d15651;
      background-color: #ffffff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Dynamic 'Others' Text Field Container */
    #otherCategoryContainer {
      display: none;
      margin-top: 10px;
    }

    /* Submit Button */
    .submit-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background-color: #d15651;
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 3px 6px rgba(209, 86, 81, 0.2);
    }

    .submit-btn:hover {
      background-color: #b54843;
      transform: translateY(-1px);
    }

    /* Success Message State */
    .thank-you-box {
      display: none;
      text-align: center;
      padding: 30px 10px;
    }

    .thank-you-box h2 {
      font-size: 24px;
      color: #111;
      margin-bottom: 10px;
    }

    .thank-you-box p {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <form id="feedbackForm" onsubmit="handleFormSubmit(event)">
      <h1>Rate Your Experience</h1>
      <p class="intro">We value your input! Please let us know how satisfied you were visiting <span class="brand-name">Out of the Archives</span>.</p>

      <div class="form-group">
        <label style="text-align: center;">Overall Rating</label>
        <div class="star-rating">
          <input type="radio" id="star5" name="rating" value="5" required>
          <label for="star5" title="5 stars">★</label>
          <input type="radio" id="star4" name="rating" value="4">
          <label for="star4" title="4 stars">★</label>
          <input type="radio" id="star3" name="rating" value="3">
          <label for="star3" title="3 stars">★</label>
          <input type="radio" id="star2" name="rating" value="2">
          <label for="star2" title="2 stars">★</label>
          <input type="radio" id="star1" name="rating" value="1">
          <label for="star1" title="1 star">★</label>
        </div>
      </div>

      <div class="form-group">
        <label for="category">What is your feedback about?</label>
        <select id="category" name="category" onchange="toggleOtherInput(this)" required>
          <option value="" disabled selected hidden>Select an option...</option>
          <option value="Website Design">Website Design & Ease of Use</option>
          <option value="Information Content">Information & Content Quality</option>
          <option value="Suggestions">Suggestions / Improvements</option>
          <option value="General">General Experience</option>
          <option value="Others">Others</option>
        </select>

        <div id="otherCategoryContainer">
          <input type="text" id="otherCategoryInput" name="otherCategory" placeholder="Please specify your topic...">
        </div>
      </div>

      <div class="form-group">
        <label for="name">Name (Optional)</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="comments">Your Feedback</label>
        <textarea id="comments" name="comments" placeholder="Tell us what you liked or what we can improve..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>

    <div id="thankYouBox" class="thank-you-box">
      <h2>Thank You!</h2>
      <p>Your feedback has been submitted successfully. We appreciate your time and help in improving <span class="brand-name">Out of the Archives</span>.</p>
    </div>

    <footer>
      &copy; <span class="brand-name">Out of the Archives Project</span>
    </footer>
  </div>

  <script>
    function toggleOtherInput(selectElement) {
      const container = document.getElementById('otherCategoryContainer');
      const input = document.getElementById('otherCategoryInput');
      
      if (selectElement.value === 'Others') {
        container.style.display = 'block';
        input.required = true;
      } else {
        container.style.display = 'none';
        input.required = false;
        input.value = '';
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      document.getElementById('feedbackForm').style.display = 'none';
      document.getElementById('thankYouBox').style.display = 'block';
    }
  </script>

</body>
</html>
